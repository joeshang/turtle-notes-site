name: Build and deploy GitHub Pages
run-name: Pages ${{ inputs.request_id || github.run_id }} ${{ inputs.release_tag || 'latest' }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Expected public release tag; empty selects latest
        type: string
        required: false
      release_build:
        description: Expected build number for both products
        type: string
        required: false
      source_sha:
        description: Website source revision selected by release.sh
        type: string
        required: false
      request_id:
        description: Unique release.sh request identifier
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test pull request
        if: github.event_name == 'pull_request'
        run: npm test && npm run verify
      - name: Build the verified release website
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_BUILD: ${{ inputs.release_build }}
          RELEASE_REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: npm run build:pages
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
